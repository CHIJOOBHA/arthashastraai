name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Build server bundle
        run: npm run build:server
      - name: Unit tests
        run: npm test
      - name: Integration + security-rules tests (Firebase emulators)
        id: emu
        run: |
          set -o pipefail
          npx -y firebase-tools@14 emulators:exec --only auth,firestore --project demo-arthashastra \
            "npx tsx --test tests/integration.test.ts tests/rules/rules.test.ts" 2>&1 | tee emulator-tests.log
      - name: Post test failures as a commit comment
        if: failure() && steps.emu.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Emulator test failures'
            echo '```'
            grep -E -A14 '^not ok|^ *not ok|Error:|error:' emulator-tests.log | head -c 60000
            echo
            tail -n 25 emulator-tests.log
            echo '```'
          } > comment.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@comment.md
