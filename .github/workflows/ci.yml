name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Build server bundle
        run: npm run build:server
      - name: Unit tests
        run: npm test
      - name: Integration + security-rules tests (Firebase emulators)
        run: >
          npx -y firebase-tools@14 emulators:exec --only auth,firestore --project demo-arthashastra
          "npx tsx --test tests/integration.test.ts tests/rules/rules.test.ts"
