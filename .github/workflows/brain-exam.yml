name: Brain exam

# Runs the 15-question reasoning exam against the REAL AI and posts the scores.
# Needs repository secret ANTHROPIC_API_KEY and/or GEMINI_API_KEY.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: run only these questions, e.g. 1,6a,6b"
        required: false
        default: ""
      provider:
        description: "claude or gemini"
        required: false
        default: "claude"

jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run exam
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ inputs.provider }}
          EVAL_ONLY: ${{ inputs.only }}
        run: npm run eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brain-exam
          path: eval-results/
      - name: Post the score summary as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls -t eval-results/*.md 2>/dev/null | head -1)
          [ -n "$f" ] || exit 0
          sed '/^## Details/,$d' "$f" > summary.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@summary.md
